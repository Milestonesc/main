<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 현황판</title>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --line: #e3e6eb; --text: #1d2330; --sub: #6b7280; --faint: #9aa1ad;
  --accent: #2f6fed; --accent-soft: #e8efff; --danger: #d64545; --ok: #1f9d55; --warn: #c27c0e;
  --off: #fdecec; --weekend: #f7f8fa; --radius: 10px;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
button:hover { border-color: #c9ced6; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.05); }
button.ghost { border-color: transparent; background: transparent; }
button.ghost:hover { background: #eef0f3; }
button.danger { color: var(--danger); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; background: #fff; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea { resize: vertical; }
label { color: var(--sub); font-size: 12px; display: block; margin-bottom: 3px; }
.hidden { display: none !important; }
.muted { color: var(--sub); }
.faint { color: var(--faint); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: #eef0f3; color: var(--sub); white-space: nowrap; }
.pill.진행 { background: var(--accent-soft); color: var(--accent); }
.pill.완료 { background: #e6f6ec; color: var(--ok); }
.pill.보류 { background: #fff4e0; color: var(--warn); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.bar { height: 6px; background: #eceef2; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.empty { padding: 40px; text-align: center; color: var(--faint); }

/* 로그인 */
#login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 100%; max-width: 380px; }
.card h1 { font-size: 20px; margin: 0 0 6px; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 16px 0; }
.names button { padding: 10px 6px; }
.names button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* 앱 */
header { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 12px; padding: 10px 18px; flex-wrap: wrap; }
.top h1 { font-size: 16px; margin: 0 12px 0 0; white-space: nowrap; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav button { border: none; background: none; padding: 8px 12px; border-radius: 8px; color: var(--sub); }
nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav button .count { background: var(--danger); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 6px; margin-left: 4px; }
main { padding: 18px; max-width: 1400px; margin: 0 auto; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar h2 { font-size: 17px; margin: 0 8px 0 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

/* 달력 */
#calendar { padding: 12px; }
.fc { --fc-border-color: var(--line); --fc-today-bg-color: #f3f7ff; font-size: 13px; }
.fc .fc-toolbar-title { font-size: 17px; }
.fc .fc-button { background: #fff; color: var(--text); border-color: var(--line); box-shadow: none !important; }
.fc .fc-button-primary:not(:disabled).fc-button-active, .fc .fc-button:hover { background: #eef0f3; color: var(--text); border-color: #c9ced6; }
.fc .fc-daygrid-day.off .fc-daygrid-day-number, .fc .fc-day-sun .fc-daygrid-day-number { color: var(--danger); }
.fc .fc-day-sat .fc-daygrid-day-number { color: #3b6fd6; }
.fc .fc-event { cursor: pointer; border: none; padding: 1px 4px; }
.fc .holiday-label { font-size: 11px; color: var(--danger); padding: 0 4px; }
.fc-daygrid-day.off { background: #fff8f8; }

/* 타임라인 */
.tl { overflow-x: auto; position: relative; }
.tl table { border-collapse: collapse; table-layout: fixed; }
.tl th, .tl td { border-bottom: 1px solid var(--line); padding: 0; height: 30px; }
.tl .name { position: sticky; left: 0; z-index: 3; background: var(--panel); width: 220px; min-width: 220px; padding: 0 10px;
           border-right: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.tl .name.sub { padding-left: 26px; color: var(--sub); font-size: 12px; }
.tl .name.proj { font-weight: 600; cursor: pointer; }
.tl .day { width: 26px; min-width: 26px; font-size: 11px; color: var(--faint); font-weight: normal; text-align: center; }
.tl .day.we, .tl td.we { background: var(--weekend); }
.tl .day.off, .tl td.off { background: var(--off); color: var(--danger); }
.tl .mon { text-align: left; padding-left: 6px; font-size: 12px; color: var(--sub); border-left: 1px solid var(--line); }
.tl .lane { position: relative; }
.tl .seg { position: absolute; top: 6px; height: 18px; border-radius: 5px; color: #fff; font-size: 11px; line-height: 18px; padding: 0 6px;
          white-space: nowrap; overflow: hidden; cursor: pointer; }
.tl .seg.thin { top: 11px; height: 8px; opacity: .45; }
.tl .today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); opacity: .6; z-index: 2; pointer-events: none; }

/* 프로젝트 카드 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.pcard { padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
.pcard:hover { border-color: #c9ced6; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
.pcard h3 { font-size: 15px; margin: 0; display: flex; gap: 8px; align-items: center; }
.pcard .meta { font-size: 12px; color: var(--sub); display: flex; gap: 10px; flex-wrap: wrap; }

/* 목록 */
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 9px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.list li:last-child { border-bottom: none; }
.group-title { font-size: 13px; font-weight: 600; margin: 18px 0 8px; color: var(--sub); }
.group-title.late { color: var(--danger); }
table.grid { width: 100%; border-collapse: collapse; }
table.grid th, table.grid td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.grid th { font-size: 12px; color: var(--sub); font-weight: 500; background: #fafbfc; position: sticky; top: 0; }
table.grid td.num, table.grid th.num { text-align: right; white-space: nowrap; }
table.grid tr:hover td { background: #fafbfd; }
.link { color: var(--accent); cursor: pointer; text-decoration: none; }
.link:hover { text-decoration: underline; }

/* 프로젝트 상세 (오른쪽 창) */
.overlay { position: fixed; inset: 0; background: rgba(15, 20, 30, .28); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg); z-index: 41;
          display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.12); }
.drawer-head { background: var(--panel); border-bottom: 1px solid var(--line); padding: 16px 20px 0; }
.drawer-head h2 { margin: 0; font-size: 18px; display: flex; gap: 8px; align-items: center; }
.drawer-body { overflow-y: auto; padding: 16px 20px 40px; flex: 1; }
.subtabs { display: flex; gap: 2px; margin-top: 12px; }
.subtabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--sub); }
.subtabs button.on { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
.phase { margin-bottom: 12px; }
.phase-head { padding: 10px 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
.phase-head b { font-size: 14px; }
.task { display: flex; gap: 8px; align-items: center; padding: 7px 14px; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: none; }
.task input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
.task .text { flex: 1; cursor: text; }
.task.done .text { color: var(--faint); text-decoration: line-through; }
.task .who { font-size: 12px; }
.task .due { font-size: 12px; color: var(--sub); white-space: nowrap; }
.task .due.late { color: var(--danger); font-weight: 600; }
.task .acts { opacity: 0; }
.task:hover .acts { opacity: 1; }
.addtask { display: flex; gap: 6px; padding: 8px 14px; background: #fbfbfc; border-radius: 0 0 var(--radius) var(--radius); }
.addtask input[type=text] { flex: 1; }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 12px; }
.form-grid .full { grid-column: 1 / -1; }
.form-grid input, .form-grid select, .form-grid textarea { width: 100%; }
.phase-edit { display: grid; grid-template-columns: 20px 1fr 150px 150px auto; gap: 6px; align-items: center; margin-bottom: 6px; }
.phase-edit > span:last-child { display: flex; }
.phase-edit button { padding: 4px 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { display: inline-flex; gap: 4px; align-items: center; margin: 0; padding: 4px 9px; border: 1px solid var(--line);
              border-radius: 99px; color: var(--text); font-size: 13px; cursor: pointer; background: #fff; }
.chips input, .form-grid .chips input { margin: 0; width: auto; }
.chips label { white-space: nowrap; }
.colors { display: flex; gap: 6px; }
.colors button { width: 24px; height: 24px; border-radius: 6px; padding: 0; border: 2px solid transparent; }
.colors button.on { border-color: var(--text); }
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 16px; text-align: center; color: var(--sub); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.comment { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.comment .who { font-weight: 600; margin-right: 8px; }
.comment .body { white-space: pre-wrap; margin-top: 4px; }
.logline { padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; display: flex; gap: 10px; }
.logline .at { color: var(--faint); white-space: nowrap; width: 92px; flex: none; }
.logline .by { font-weight: 600; white-space: nowrap; }

.modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 51; background: var(--panel);
         border-radius: 14px; width: min(560px, calc(100% - 32px)); max-height: calc(100vh - 40px); overflow-y: auto; padding: 22px; }
.modal h2 { margin: 0 0 14px; font-size: 17px; }
.modal-overlay { z-index: 50; }
.section { margin-bottom: 18px; }
.section h3 { font-size: 13px; margin: 0 0 8px; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d2330; color: #fff; padding: 10px 16px;
         border-radius: 10px; z-index: 60; font-size: 13px; max-width: calc(100% - 32px); }
#toast.err { background: var(--danger); }
#busy { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 70; background: linear-gradient(90deg, transparent, var(--accent), transparent);
        background-size: 200% 100%; animation: busy 1s linear infinite; }
@keyframes busy { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (max-width: 700px) {
  .form-grid { grid-template-columns: 1fr; }
  .phase-edit { grid-template-columns: 1fr 1fr; }
  .tl .name { width: 140px; min-width: 140px; }
}
</style>
</head>
<body>
<div id="busy" class="hidden"></div>
<div id="toast" class="hidden"></div>

<!-- 로그인 -->
<div id="login" class="hidden">
  <div class="card">
    <h1>프로젝트 현황판</h1>
    <div class="muted" id="login-sub">이름을 골라 주세요</div>
    <div id="first-run" class="hidden">
      <p class="muted" style="margin-top:14px">처음이에요. 함께 쓸 직원 이름을 한 줄에 한 명씩 적어 주세요.</p>
      <textarea id="first-names" rows="6" style="width:100%" placeholder="김민수&#10;이지은&#10;박준호"></textarea>
      <button class="primary" style="width:100%;margin-top:10px" onclick="firstRun()">시작하기</button>
    </div>
    <div id="name-pick">
      <div class="names" id="names"></div>
      <div id="pass-wrap" class="hidden" style="margin-bottom:12px">
        <label>팀 비밀번호</label>
        <input id="pass" type="password" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="primary" style="width:100%" onclick="doLogin()">들어가기</button>
    </div>
  </div>
</div>

<!-- 앱 -->
<div id="app" class="hidden">
  <header>
    <div class="top">
      <h1>📅 프로젝트 현황판</h1>
      <nav id="nav"></nav>
      <div class="grow"></div>
      <button class="primary" onclick="editProject()">+ 새 프로젝트</button>
      <button class="ghost" onclick="openSettings()" title="설정">⚙</button>
      <button class="ghost" onclick="logout()" id="me-btn" title="다른 이름으로"></button>
    </div>
  </header>
  <main id="view"></main>
</div>

<div id="layer"></div>

<script>
// ───────── 상태 ─────────
var S = { auth: null, data: null, view: 'calendar', open: null, sub: 'tasks', cal: null, calDate: null,
          tlStart: null, filters: { status: '진행', q: '', costProject: '', costKind: '', costMonth: '', logProject: '' },
          editing: false };
var COLORS = ['#2f6fed', '#e5534b', '#1f9d55', '#c27c0e', '#8b5cf6', '#0e9aa7', '#d6409f', '#5b6472'];
var VIEWS = [['calendar', '달력'], ['timeline', '타임라인'], ['projects', '프로젝트'], ['mine', '내 할 일'], ['costs', '비용·문서'], ['log', '기록']];
var WD = ['일', '월', '화', '수', '목', '금', '토'];

// ───────── 서버 호출 ─────────
var pending = 0;
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  pending++; document.getElementById('busy').classList.remove('hidden');
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(function (v) { done(); resolve(v); })
      .withFailureHandler(function (e) { done(); toast((e && e.message) || String(e), true); reject(e); });
    r[fn].apply(r, args);
  });
  function done() { if (--pending <= 0) { pending = 0; document.getElementById('busy').classList.add('hidden'); } }
}
function call(fn) { // 로그인 정보를 붙여 부르고, 끝나면 새로 읽는다
  var args = [fn, S.auth].concat(Array.prototype.slice.call(arguments, 1));
  return api.apply(null, args).then(function (v) { return reload().then(function () { return v; }); });
}
function reload() {
  return api('getData', S.auth).then(function (d) { S.data = d; render(); });
}

// ───────── 도우미 ─────────
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg, err) {
  var t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; clearTimeout(toast.t);
  toast.t = setTimeout(function () { t.className = 'hidden'; }, err ? 6000 : 2500);
}
function parse(s) { return new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); }
function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
function md(s) { return s ? +s.slice(5, 7) + '/' + +s.slice(8, 10) : ''; }
function mdw(s) { return s ? md(s) + '(' + WD[parse(s).getDay()] + ')' : ''; }
function span(s, e) { return s || e ? md(s || e) + (e && e !== s ? ' ~ ' + md(e) : '') : '날짜 없음'; }
function won(n) { return n === '' || n === null || n === undefined || isNaN(+n) ? '' : (+n).toLocaleString('ko-KR') + '원'; }
function when(at) { return at ? md(at.slice(0, 10)) + ' ' + at.slice(11, 16) : ''; }
function holidayOn(s) { return (S.data.holidays || []).filter(function (h) { return h.date === s; }); }
function isOff(s) { var w = parse(s).getDay(); return w === 0 || w === 6 || holidayOn(s).some(function (h) { return h.off; }); }
function project(id) { return S.data.projects.filter(function (p) { return p.id === id; })[0]; }
function colorOf(p) { return p.color || COLORS[S.data.projects.indexOf(p) % COLORS.length]; }
function phasesOf(pid) { return S.data.phases.filter(function (x) { return x.projectId === pid; }).sort(function (a, b) { return a.order - b.order; }); }
function tasksOf(pid, phid) { return S.data.tasks.filter(function (t) { return t.projectId === pid && (phid === undefined || t.phaseId === phid); }); }
function progress(tasks) { return tasks.length ? Math.round(100 * tasks.filter(function (t) { return t.done; }).length / tasks.length) : null; }
function bar(pct) { return '<div class="bar"><i style="width:' + (pct || 0) + '%"></i></div>'; }
function membersOf(p) { return (p.members || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean); }
function projRange(p) {
  var ph = phasesOf(p.id), s = p.start, e = p.end;
  ph.forEach(function (x) { if (x.start && (!s || x.start < s)) s = x.start; if (x.end && (!e || x.end > e)) e = x.end; });
  return [s || e, e || s];
}
function options(list, cur, blank) {
  return (blank !== undefined ? '<option value="">' + esc(blank) + '</option>' : '') +
    list.map(function (v) { v = Array.isArray(v) ? v : [v, v];
      return '<option value="' + esc(v[0]) + '"' + (String(v[0]) === String(cur) ? ' selected' : '') + '>' + esc(v[1]) + '</option>'; }).join('');
}

// ───────── 로그인 ─────────
function start() {
  try { S.auth = JSON.parse(localStorage.getItem('pb_auth') || 'null'); } catch (e) { S.auth = null; }
  api('getLoginInfo').then(function (info) {
    if (S.auth && info.names.indexOf(S.auth.name) >= 0) {
      return reload().then(showApp).catch(function () { showLogin(info); });
    }
    showLogin(info);
  });
}
function showLogin(info) {
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  var first = !info.names.length;
  $('first-run').classList.toggle('hidden', !first); $('name-pick').classList.toggle('hidden', first);
  $('login-sub').textContent = first ? '' : '이름을 골라 주세요';
  $('pass-wrap').classList.toggle('hidden', !info.needPassword);
  $('names').innerHTML = info.names.map(function (n) {
    return '<button onclick="pickName(this)" data-name="' + esc(n) + '">' + esc(n) + '</button>'; }).join('');
}
function pickName(b) {
  Array.prototype.forEach.call(document.querySelectorAll('.names button'), function (x) { x.classList.remove('on'); });
  b.classList.add('on'); S.pick = b.getAttribute('data-name');
  if ($('pass-wrap').classList.contains('hidden')) doLogin(); else $('pass').focus();
}
function doLogin() {
  if (!S.pick) return toast('이름을 골라 주세요', true);
  var auth = { name: S.pick, pass: $('pass').value };
  api('login', auth).then(function () {
    S.auth = auth; localStorage.setItem('pb_auth', JSON.stringify(auth));
    return reload().then(showApp);
  });
}
function firstRun() {
  var names = $('first-names').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  if (!names.length) return toast('이름을 한 명 이상 적어 주세요', true);
  api('saveMembers', null, names).then(function () { return api('getLoginInfo'); }).then(showLogin);
}
function logout() { localStorage.removeItem('pb_auth'); S.auth = null; S.pick = null; start(); }
function showApp() {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('me-btn').textContent = '👤 ' + S.auth.name;
  render();
}

// ───────── 화면 그리기 ─────────
function render() {
  if (!S.data || $('app').classList.contains('hidden')) return;
  var mine = S.data.tasks.filter(function (t) { return !t.done && t.assignee === S.auth.name && t.due && t.due <= S.data.today; }).length;
  $('nav').innerHTML = VIEWS.map(function (v) {
    return '<button class="' + (S.view === v[0] ? 'on' : '') + '" onclick="go(\'' + v[0] + '\')">' + v[1] +

  if (S.view !== 'calendar' && S.cal) { S.calDate = S.cal.getDate(); S.cal.destroy(); S.cal = null; }
  ({ calendar: viewCalendar, timeline: viewTimeline, projects: viewProjects, mine: viewMine, costs: viewCosts, log: viewLog })[S.view]();

// 달력
function viewCalendar() {

    $('view').innerHTML = '<div class="toolbar"><h2>달력</h2>' +
      '<label class="row" style="margin:0"><input type="checkbox" id="cs-ph" ' + (show.phases ? 'checked' : '') + ' onchange="S.calShow.phases=this.checked;calEvents()"> 단계 일정</label>' +
      '<label class="row" style="margin:0"><input type="checkbox" id="cs-tk" ' + (show.tasks ? 'checked' : '') + ' onchange="S.calShow.tasks=this.checked;calEvents()"> 할 일 기한</label>' +
      '<div class="grow"></div><span class="faint">일정을 누르면 프로젝트가 열려요</span></div><div class="panel" id="calendar"></div>';

    S.cal = new FullCalendar.Calendar($('calendar'), {

      titleFormat: function (a) { return a.date.year + '년 ' + (a.date.month + 1) + '월'; },
      dayHeaderContent: function (a) { return WD[a.date.getDay()]; },
      dayCellContent: function (a) { return a.date.getDate(); },
      dayCellClassNames: function (a) { return holidayOn(ymd(a.date)).some(function (h) { return h.off; }) ? ['off'] : []; },

      }
    });

  }
  calEvents();
}
function calEvents() {
  if (!S.cal) return;
  var ev = [], show = S.calShow;
  S.data.projects.forEach(function (p) {
    var c = colorOf(p), ph = phasesOf(p.id);
    if (show.phases) {
      if (ph.length) ph.forEach(function (x) {
        if (!x.start && !x.end) return;
        ev.push({ title: p.name + ' · ' + x.name, start: x.start || x.end, end: addDays(x.end || x.start, 1), allDay: true,
                  backgroundColor: c, extendedProps: { pid: p.id, kind: 'phase' } });
      });
      else if (p.start || p.end) ev.push({ title: p.name, start: p.start || p.end, end: addDays(p.end || p.start, 1), allDay: true,

}

// 타임라인
function viewTimeline() {
  var today = S.data.today;
  if (!S.tlStart) S.tlStart = addDays(today, -10);
  var days = 120, start = S.tlStart, end = addDays(start, days - 1);
  var list = S.data.projects.filter(function (p) { return S.filters.status === '전체' || p.status === S.filters.status; })
    .filter(function (p) { var r = projRange(p); return r[0] && !(r[1] < start || r[0] > end); })
    .sort(function (a, b) { return (projRange(a)[0] || '') < (projRange(b)[0] || '') ? -1 : 1; });
  var cells = [], months = [], d = start;
  for (var i = 0; i < days; i++, d = addDays(d, 1)) {
    var cls = holidayOn(d).some(function (h) { return h.off; }) ? 'off' : (parse(d).getDay() % 6 === 0 ? 'we' : '');
    cells.push({ d: d, cls: cls });
    if (i === 0 || d.slice(8) === '01') months.push({ label: +d.slice(0, 4) + '년 ' + +d.slice(5, 7) + '월', n: 0 });
    months[months.length - 1].n++;
  }
  var dayW = 26;
  function segs(items) {
    return items.map(function (it) {
      var s = it.s < start ? start : it.s, e = it.e > end ? end : it.e;
      if (e < start || s > end) return '';
      var left = diffDays(start, s) * dayW, width = (diffDays(s, e) + 1) * dayW - 2;
      return '<div class="seg ' + (it.thin ? 'thin' : '') + '" style="left:' + left + 'px;width:' + width + 'px;background:' + it.c + '" title="' +
        esc(it.title) + '" onclick="openProject(\'' + it.pid + '\')">' + (it.thin ? '' : esc(it.label)) + '</div>';
    }).join('');
  }
  var todayLeft = diffDays(start, today) * dayW + dayW / 2;
  var rows = list.map(function (p) {
    var c = colorOf(p), r = projRange(p), ph = phasesOf(p.id), pr = progress(tasksOf(p.id));
    var head = '<tr><td class="name proj" onclick="openProject(\'' + p.id + '\')" title="' + esc(p.name) + '"><span class="dot" style="background:' + c + '"></span> ' +
      esc(p.name) + (pr === null ? '' : ' <span class="faint" style="font-weight:normal">' + pr + '%</span>') + '</td>' +
      '<td colspan="' + days + '" class="lane">' + segs([{ s: r[0], e: r[1], c: c, pid: p.id, label: p.name, title: p.name + ' ' + span(r[0], r[1]), thin: ph.length > 0 }]) + '</td></tr>';
    var subs = ph.filter(function (x) { return x.start || x.end; }).map(function (x) {
      var px = progress(tasksOf(p.id, x.id));
      return '<tr><td class="name sub">' + esc(x.name) + (px === null ? '' : ' · ' + px + '%') + '</td><td colspan="' + days + '" class="lane">' +
        segs([{ s: x.start || x.end, e: x.end || x.start, c: c, pid: p.id, label: x.name + ' ' + span(x.start, x.end), title: p.name + ' · ' + x.name + ' ' + span(x.start, x.end) }]) + '</td></tr>';
    }).join('');
    return head + subs;
  }).join('');
  $('view').innerHTML = '<div class="toolbar"><h2>타임라인</h2>' +
    '<button onclick="S.tlStart=addDays(S.tlStart,-30);render()">◀</button><button onclick="S.tlStart=null;render()">오늘</button>' +
    '<button onclick="S.tlStart=addDays(S.tlStart,30);render()">▶</button>' + statusFilter() + '</div>' +
    '<div class="panel tl"><div style="position:relative;width:' + (220 + days * dayW) + 'px">' +
    (today >= start && today <= end ? '<div class="today" style="left:' + (220 + todayLeft) + 'px"></div>' : '') +
    '<table><thead><tr><th class="name"></th>' + months.map(function (m) { return '<th class="mon" colspan="' + m.n + '">' + m.label + '</th>'; }).join('') + '</tr>' +
    '<tr><th class="name faint" style="font-weight:normal;font-size:12px">프로젝트 · 단계</th>' + cells.map(function (c) {
      return '<th class="day ' + c.cls + '" title="' + esc(holidayOn(c.d).map(function (h) { return h.name; }).join(', ')) + '">' + +c.d.slice(8) + '</th>'; }).join('') + '</tr></thead>' +
    '<tbody>' + (rows || '<tr><td class="name faint">이 기간에 일정이 있는 프로젝트가 없어요</td><td colspan="' + days + '"></td></tr>') + '</tbody></table></div></div>';
}
function statusFilter() {
  return '<select onchange="S.filters.status=this.value;render()">' + options([['진행', '진행 중'], ['보류', '보류'], ['완료', '완료'], ['전체', '전체']], S.filters.status) + '</select>';
}

// 내 할 일
function viewMine() {
  var me = S.auth.name, today = S.data.today;
  var week = addDays(today, 7 - parse(today).getDay());
  var mine = S.data.tasks.filter(function (t) { return t.assignee === me && !t.done; });
  var groups = [['지난 기한', function (t) { return t.due && t.due < today; }, 'late'], ['오늘', function (t) { return t.due === today; }],
                ['이번 주', function (t) { return t.due > today && t.due <= week; }], ['나중', function (t) { return t.due > week; }],
                ['기한 없음', function (t) { return !t.due; }]];
  var html = '<div class="toolbar"><h2>내 할 일</h2><span class="muted">' + esc(me) + '님에게 배정된 할 일</span></div>';
  var any = false;
  groups.forEach(function (g) {
    var items = mine.filter(g[1]).sort(function (a, b) { return (a.due || '') < (b.due || '') ? -1 : 1; });
    if (!items.length) return; any = true;
    html += '<div class="group-title ' + (g[2] || '') + '">' + g[0] + ' · ' + items.length + '</div><div class="panel">' +
      items.map(function (t) { return taskRow(t, true); }).join('') + '</div>';
  });
  if (!any) html += '<div class="panel empty">남은 할 일이 없어요 🎉</div>';
  var soon = [];
  S.data.projects.filter(function (p) { return p.status === '진행' && membersOf(p).indexOf(me) >= 0; }).forEach(function (p) {
    phasesOf(p.id).forEach(function (x) { if (x.end && x.end >= today && x.end <= addDays(today, 14)) soon.push({ p: p, x: x }); });
  });
  if (soon.length) {
    html += '<div class="group-title">내 프로젝트의 다가오는 단계 마감 (2주)</div><div class="panel"><ul class="list">' +
      soon.sort(function (a, b) { return a.x.end < b.x.end ? -1 : 1; }).map(function (s) {
        var pr = progress(tasksOf(s.p.id, s.x.id));
        return '<li><span class="dot" style="background:' + colorOf(s.p) + '"></span><a class="link" onclick="openProject(\'' + s.p.id + '\')">' + esc(s.p.name) +
          '</a> · ' + esc(s.x.name) + '<span class="grow"></span>' + (pr === null ? '' : '<span class="muted">' + pr + '%</span>') +
          '<b>' + mdw(s.x.end) + '</b> <span class="faint">D-' + diffDays(today, s.x.end) + '</span></li>'; }).join('') + '</ul></div>';
  }
  $('view').innerHTML = html;
}

function taskRow(t, showProject) {

  return '<div class="task ' + (t.done ? 'done' : '') + '"><input type="checkbox" ' + (t.done ? 'checked' : '') + ' onchange="toggleTask(\'' + t.id + '\',this.checked)">' +
    '<span class="text" ondblclick="editTask(\'' + t.id + '\')" title="두 번 누르면 고쳐요">' + esc(t.text) +

function bindDrop() {
  var d = $('drop'); if (!d) return;
  ['dragenter', 'dragover'].forEach(function (e) { d.addEventListener(e, function (ev) { ev.preventDefault(); d.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (e) { d.addEventListener(e, function (ev) { ev.preventDefault(); d.classList.remove('over'); }); });
  d.addEventListener('drop', function (ev) { S.dropped = Array.prototype.slice.call(ev.dataTransfer.files); showFiles(); });
}
function pickedFiles() { return S.dropped && S.dropped.length ? S.dropped : Array.prototype.slice.call(($('c-file') || {}).files || []); }
function showFiles() {
  if ($('c-file').files.length) S.dropped = null;
  var fs = pickedFiles();
  $('c-files').textContent = fs.map(function (f) { return f.name + ' (' + Math.ceil(f.size / 1024) + 'KB)'; }).join(', ');
  if (fs.length === 1 && !$('c-title').value) $('c-title').value = fs[0].name.replace(/\.[^.]+$/, '');
}
function readFile(f) {
  return new Promise(function (resolve, reject) {
    if (f.size > 40 * 1024 * 1024) return reject(new Error(f.name + ': 40MB보다 큰 파일은 드라이브에 직접 올려 주세요.'));
    var r = new FileReader();
    r.onload = function () { resolve({ name: f.name, mimeType: f.type || 'application/octet-stream', data: String(r.result).split(',')[1] }); };
    r.onerror = function () { reject(r.error); };
    r.readAsDataURL(f);
  });
}
function addCost() {
  var base = { projectId: S.open, kind: $('c-kind').value, date: $('c-date').value, title: $('c-title').value.trim(),
               vendor: $('c-vendor').value.trim(), amount: $('c-amount').value, memo: $('c-memo').value.trim() };
  var files = pickedFiles();
  if (!files.length && !base.title) return toast('파일을 고르거나 내용을 적어 주세요', true);
  var jobs = files.length ? files.map(function (f, i) {
    return function () { return readFile(f).then(function (file) {
      var c = Object.assign({}, base, { file: file });
      if (files.length > 1) { c.title = base.title ? base.title + ' - ' + f.name : f.name; if (i > 0) c.amount = ''; } // 금액은 첫 파일에만
      return api('addCost', S.auth, c); }); };
  }) : [function () { return api('addCost', S.auth, base); }];
  S.dropped = null;
  $('c-send').disabled = true; $('c-send').textContent = '올리는 중…'; // 두 번 눌러 같은 파일이 두 번 올라가지 않게
  jobs.reduce(function (pr, job) { return pr.then(job); }, Promise.resolve())
    .then(function () { toast(jobs.length > 1 ? jobs.length + '건 올렸어요' : '올렸어요'); return reload(); })
    .catch(function (e) { toast(e.message || String(e), true); return reload(); });
}

function openFile(id) {
  var win = window.open('', '_blank');
  api('getFile', S.auth, id).then(function (f) {
    var bytes = atob(f.data), arr = new Uint8Array(bytes.length);
    for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: f.mimeType }));
    var viewable = /^(application\/pdf|image\/|text\/)/.test(f.mimeType);
    if (viewable && win) { win.location.href = url; return; }
    if (win) win.close();
    var a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
  }).catch(function () { if (win) win.close(); });
}

      if (Object.keys(st).length) jobs.push(api('saveSettings', S.auth, st));
      return Promise.all(jobs).then(function () {
        if (st.teamPassword) { S.auth.pass = st.teamPassword; localStorage.setItem('pb_auth', JSON.stringify(S.auth)); }
        return reload();
      });
    }, s.hasPassword ? '<button class="ghost danger" onclick="if(confirm(\'팀 비밀번호를 끌까요?\'))api(\'saveSettings\',S.auth,{teamPassword:\'\'}).then(function(){S.auth.pass=\'\';localStorage.setItem(\'pb_auth\',JSON.stringify(S.auth));closeModal();reload();})">비밀번호 끄기</button>' : '');
}

// ───────── 모달 ─────────
function modal(title, body, onSave, extra) {
  S.editing = true;
  var m = document.createElement('div'); m.id = 'modal-wrap';
  m.innerHTML = '<div class="overlay modal-overlay"></div><div class="modal"><h2>' + esc(title) + '</h2>' + body +
    '<div class="row" style="margin-top:18px">' + (extra || '') + '<span class="grow"></span><button onclick="closeModal()">취소</button><button class="primary" id="modal-save">저장</button></div></div>';
  closeModal(); document.body.appendChild(m);
  $('modal-save').onclick = function () {
    var b = $('modal-save'); b.disabled = true;
    Promise.resolve(onSave()).then(function () { closeModal(); toast('저장했어요'); }).catch(function () { b.disabled = false; });
  };
  var first = m.querySelector('input,textarea'); if (first) first.focus();
}
function closeModal() { var m = $('modal-wrap'); if (m) m.remove(); S.editing = false; }
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if ($('modal-wrap')) closeModal(); else if (S.open) closeDrawer();
});

// ───────── 엑셀 ─────────
function saveXlsx(wb, filename) {
  var bytes = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  var url = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  var a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
}
function exportCosts() {
  var rows = costRows().map(function (c) { var p = project(c.projectId);
    return { 날짜: c.date, 프로젝트: p ? p.name : '', 종류: c.kind, 내용: c.title, 거래처: c.vendor, 금액: c.amount === '' ? '' : +c.amount, 메모: c.memo,
             파일: c.fileName, 올린사람: c.by, 올린시각: c.at.replace('T', ' ') }; });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), '비용·문서');
  saveXlsx(wb, '비용문서_' + S.data.today + '.xlsx');
}
function exportAll() {
  var wb = XLSX.utils.book_new(), d = S.data;
  var name = function (id) { var p = project(id); return p ? p.name : ''; };
  var phName = function (id) { var x = d.phases.filter(function (y) { return y.id === id; })[0]; return x ? x.name : ''; };
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(d.projects.map(function (p) { var t = tasksOf(p.id), r = projRange(p);
    return { 프로젝트: p.name, 고객사: p.client, 상태: p.status, 시작: r[0] || '', 마감: r[1] || '', 진행률: progress(t) === null ? '' : progress(t) + '%',
             구성원: p.members, 설명: p.note }; })), '프로젝트');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(d.phases.map(function (x) {
    return { 프로젝트: name(x.projectId), 단계: x.name, 시작: x.start, 끝: x.end, 진행률: progress(tasksOf(x.projectId, x.id)) === null ? '' : progress(tasksOf(x.projectId, x.id)) + '%' }; })), '단계');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(d.tasks.map(function (t) {
    return { 프로젝트: name(t.projectId), 단계: phName(t.phaseId), 할일: t.text, 담당: t.assignee, 기한: t.due, 완료: t.done ? 'O' : '', 완료한사람: t.doneBy }; })), '할 일');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(d.costs.map(function (c) {
    return { 날짜: c.date, 프로젝트: name(c.projectId), 종류: c.kind, 내용: c.title, 거래처: c.vendor, 금액: c.amount === '' ? '' : +c.amount, 메모: c.memo, 파일: c.fileName, 올린사람: c.by }; })), '비용·문서');
  saveXlsx(wb, '프로젝트현황_' + d.today + '.xlsx');
}

// ───────── 자동 새로고침 (다른 사람이 고친 것 반영) ─────────
setInterval(function () {
  if (document.hidden || S.editing || pending || !S.auth || $('app').classList.contains('hidden')) return;
  var a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.value) return; // 입력 중이면 기다린다
  reload();
}, 60000);

start();
</script>
